<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TraceLens · Turn documents into evidence</title>
<meta name="description" content="TraceLens is an AI document investigation platform: entities, relationships, timelines, contradictions and evidence gaps, with every conclusion traced to its source.">
<meta name="theme-color" content="#060a12">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="TraceLens">
<meta property="og:description" content="Turn documents into evidence. Turn evidence into insight.">
<meta property="og:image" content="assets/logo-full.png">
<script>
/* Apply the saved or system theme before first paint to avoid a flash. */
(function(){try{var t=localStorage.getItem('tracelens_theme');if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f2f5fb':'#060a12'}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="root"><noscript>TraceLens needs JavaScript to run.</noscript></div>
<div id="scrim"></div>

<script src="src/main.js"></script>
</body>
</html>
